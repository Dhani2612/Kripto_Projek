<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login | Kriptografi App</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #eaf8f9 0%, #c4e4e9 100%); 
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .login-box { 
            background: rgba(255, 255, 255, 0.95); padding: 40px 30px; 
            border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 340px; text-align: center; backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        .login-box:hover {
            transform: translateY(-5px);
        }
        h2 { color: #2ab7ca; margin-bottom: 25px; font-weight: 600; }
        input { 
            margin: 10px 0; padding: 12px 15px; width: 100%; border-radius: 8px; 
            border: 1px solid #ddd; box-sizing: border-box; font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: #2ab7ca; outline: none; box-shadow: 0 0 8px rgba(42, 183, 202, 0.3);
        }
        button { 
            background-color: #2ab7ca; color: white; border: none; padding: 12px; 
            width: 100%; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600;
            margin-top: 15px; transition: background-color 0.3s, transform 0.1s; 
        }
        button:hover { background-color: #1f9ba9; }
        button:active { transform: scale(0.98); }
        .alert { margin-bottom: 15px; padding: 10px; border-radius: 6px; font-size: 13px; color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .alert-success { color: #155724; background-color: #d4edda; border-color: #c3e6cb; }
        p { margin-top: 20px; font-size: 14px; color: #555; }
        a { color: #2ab7ca; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        a:hover { color: #178392; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <p>Belum punya akun? <a href="{{ url_for('register') }}">Daftar di sini</a></p>
    </div>
</body>
</html>
