<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Riwayat Enkripsi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fbfe 0%, #e0f2f5 100%);
            padding: 40px;
            text-align: center;
            margin: 0;
            min-height: 100vh;
        }

        h2 {
            color: #2ab7ca;
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        .table-container {
            width: 95%;
            max-width: 1000px;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background: linear-gradient(90deg, #2ab7ca 0%, #178392 100%);
            color: white;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        tr:hover td {
            background-color: rgba(42, 183, 202, 0.05);
        }

        td {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }

        td:nth-child(3) {
            font-family: monospace;
            font-size: 13px;
            color: #777;
            background: #fafafa;
        }

        a.back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.05);
            color: #555;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s;
            margin-top: 20px;
        }

        a.back-btn:hover {
            background: #2ab7ca;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(42, 183, 202, 0.3);
        }
    </style>
</head>

<body>
    <h2>📜 Riwayat Enkripsi {{ username }}</h2>

    {% if history %}
    <div class="table-container">
        <table>
            <tr>
                <th>Tanggal</th>
                <th>Plaintext</th>
                <th>Ciphertext</th>
                <th>Algoritma</th>
            </tr>
            {% for row in history %}
            <tr>
                <td>{{ row['timestamp'] }}</td>
                <td>{{ row['plaintext'] }}</td>
                <td style="word-wrap: break-word;">{{ row['ciphertext'] }}</td>
                <td>{{ row['algorithm'] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    {% else %}
    <p>Belum ada data enkripsi.</p>
    {% endif %}

    <a href="{{ url_for('dashboard') }}" class="back-btn">← Kembali ke Dashboard</a>
</body>

</html>
